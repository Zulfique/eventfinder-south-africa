services:
  - type: web
    name: eventfinder-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/EventFinder.Api/Dockerfile
    dockerContext: ./api/EventFinder.Api
    healthCheckPath: /health

    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      - key: Jwt__Secret
        generateValue: true

      - key: Jwt__Issuer
        value: eventfinder-api

      - key: Jwt__Audience
        value: eventfinder-app

      - key: Jwt__ExpiryHours
        value: "168"

      # Neon PostgreSQL connection string, supplied in the Render dashboard
      # (never committed). Use the Npgsql key/value format:
      #   Host=YOUR_NEON_HOST;Database=YOUR_DATABASE;Username=YOUR_USERNAME;Password=YOUR_PASSWORD;SSL Mode=Require
      - key: ConnectionStrings__Default
        sync: false

      - key: Google__ServerClientId
        sync: false

      - key: Brevo__ApiKey
        sync: false

      - key: Brevo__FromEmail
        sync: false

      - key: Brevo__FromName
        value: EventFinder

      - key: Firebase__ServiceAccountJson
        sync: false

      # Azure Blob Storage - the free blob store for event photos.
      # Azure's free tier (5 GB LRS storage, 20k reads / 10k writes /
      # 15 GB egress per month) needs no billing account and is enough
      # for this prototype app.
      # Create a Storage Account (locally-redundant, LRS, free tier) in
      # the Azure Portal, enable "Blob (anonymous) read access" on the
      # account, create a blob container named "event-images", and set
      # the container's public access level to "Blob" (anonymous read).
      # Then find the "Connection string" under Access Keys and paste it here.
      - key: AzureStorage__ConnectionString
        sync: false

      - key: AzureStorage__ContainerName
        sync: false

      # Optional: a custom public domain or CDN for the container.
      # When empty the API falls back to the Azure blob service URL.
      - key: AzureStorage__PublicBaseUrl
        sync: false
