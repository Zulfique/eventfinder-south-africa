services:
  - type: web
    name: eventfinder-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/EventFinder.Api/Dockerfile
    dockerContext: ./api/EventFinder.Api
    healthCheckPath: /health

    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      - key: Jwt__Secret
        generateValue: true

      - key: Jwt__Issuer
        value: eventfinder-api

      - key: Jwt__Audience
        value: eventfinder-app

      - key: Jwt__ExpiryHours
        value: "168"

      # Neon PostgreSQL connection string, supplied in the Render dashboard
      # (never committed). Use the Npgsql key/value format:
      #   Host=YOUR_NEON_HOST;Database=YOUR_DATABASE;Username=YOUR_USERNAME;Password=YOUR_PASSWORD;SSL Mode=Require
      - key: ConnectionStrings__Default
        sync: false

      - key: Google__ServerClientId
        sync: false

      - key: Brevo__ApiKey
        sync: false

      - key: Brevo__FromEmail
        sync: false

      - key: Brevo__FromName
        value: EventFinder

      - key: Firebase__ServiceAccountJson
        sync: false

      # Azure Blob Storage - the store for event photos. The Azure for Students
      # subscription covers this account; a general-purpose v2 account with LRS
      # hot blobs runs about $0.018/GB-month, so the $100 credit lasts.
      # Azure portal -> Storage account -> Security + networking -> Access keys
      # -> Connection string, pasted below (never committed).
      # The account must have "Allow Blob public access" enabled and the
      # container must exist with Blob (anonymous read) access, otherwise the
      # photo URLs return 403.
      - key: AzureStorage__ConnectionString
        sync: false

      - key: AzureStorage__ContainerName
        sync: false

      # Optional: a custom public domain or CDN in front of the account. When
      # it is empty the API falls back to
      # https://<account>.blob.core.windows.net/<container>
      - key: AzureStorage__PublicBaseUrl
        sync: false
