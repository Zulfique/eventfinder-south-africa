databases:
  # Free PostgreSQL instance managed by Render. Connection credentials are
  # injected into the API as ConnectionStrings__Default below.
  - name: eventfinder-db
    plan: free
    postgresMajorVersion: '16'
    databaseName: eventfinder
    user: eventfinder
    ipAllowList: []

services:
  - type: web
    name: eventfinder-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/EventFinder.Api/Dockerfile
    dockerContext: ./api/EventFinder.Api
    healthCheckPath: /health

    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      - key: Jwt__Secret
        generateValue: true

      - key: Jwt__Issuer
        value: eventfinder-api

      - key: Jwt__Audience
        value: eventfinder-app

      - key: Jwt__ExpiryHours
        value: "168"

      # Render injects the managed PostgreSQL connection string automatically.
      - key: ConnectionStrings__Default
        fromDatabase:
          name: eventfinder-db
          property: connectionString

      - key: Google__ServerClientId
        value: 690167106186-o9bolqrekmkv8bpbfrqd532iqe6r5m3c.apps.googleusercontent.com

      - key: Brevo__FromName
        value: EventFinder

      # Azure secrets are entered in the Render dashboard and never committed.
      - key: AzureStorage__ConnectionString
        sync: false

      - key: AzureStorage__ContainerName
        value: event-images

      - key: AzureStorage__PublicBaseUrl
        sync: false
