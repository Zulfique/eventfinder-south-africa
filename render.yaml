databases:
  - name: eventfinder-db
    databaseName: eventfinder
    user: eventfinder
    plan: free

services:
  - type: web
    name: eventfinder-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/EventFinder.Api/Dockerfile
    dockerContext: ./api/EventFinder.Api
    healthCheckPath: /health

    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      - key: Jwt__Secret
        generateValue: true

      - key: Jwt__Issuer
        value: eventfinder-api

      - key: Jwt__Audience
        value: eventfinder-app

      - key: Jwt__ExpiryHours
        value: "168"

      - key: ConnectionStrings__Default
        fromDatabase:
          name: eventfinder-db
          property: connectionString

      - key: Google__ServerClientId
        sync: false

      - key: Brevo__ApiKey
        sync: false

      - key: Brevo__FromEmail
        sync: false

      - key: Brevo__FromName
        value: EventFinder

      - key: Firebase__ServiceAccountJson
        sync: false
