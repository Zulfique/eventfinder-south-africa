services:
  - type: web
    name: eventfinder-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/EventFinder.Api/Dockerfile
    dockerContext: ./api/EventFinder.Api
    healthCheckPath: /health

    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      - key: Jwt__Secret
        generateValue: true

      - key: Jwt__Issuer
        value: eventfinder-api

      - key: Jwt__Audience
        value: eventfinder-app

      - key: Jwt__ExpiryHours
        value: "168"

      # Neon PostgreSQL connection string, supplied in the Render dashboard
      # (never committed). Use the Npgsql key/value format:
      #   Host=YOUR_NEON_HOST;Database=YOUR_DATABASE;Username=YOUR_USERNAME;Password=YOUR_PASSWORD;SSL Mode=Require
      - key: ConnectionStrings__Default
        sync: false

      - key: Google__ServerClientId
        sync: false

      - key: Brevo__ApiKey
        sync: false

      - key: Brevo__FromEmail
        sync: false

      - key: Brevo__FromName
        value: EventFinder

      - key: Firebase__ServiceAccountJson
        sync: false

      # Cloudflare R2 - the free blob store for event photos. R2 is
      # S3-compatible and its free tier (10 GB, 1M/10M operations per month,
      # zero egress) needs no Blaze billing account.
      # Create an "Object Read & Write" R2 API token in the Cloudflare
      # dashboard and paste the credentials here.
      - key: R2__AccountId
        sync: false

      - key: R2__AccessKeyId
        sync: false

      - key: R2__SecretAccessKey
        sync: false

      - key: R2__BucketName
        sync: false

      # Optional: a custom public domain for the bucket. When it is empty the
      # API falls back to https://<account>.r2.cloudflarestorage.com/<bucket>
      - key: R2__PublicBaseUrl
        sync: false
